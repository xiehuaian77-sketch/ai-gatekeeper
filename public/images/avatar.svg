<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="avatarGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.8"/>
    </linearGradient>
    <radialGradient id="cyberSphere" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#141926"/>
      <stop offset="80%" stop-color="#090a0f"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0.3"/>
    </radialGradient>
  </defs>
  <circle cx="100" cy="100" r="94" fill="url(#cyberSphere)" stroke="url(#avatarGlow)" stroke-width="3"/>
  <circle cx="100" cy="100" r="80" fill="none" stroke="#1f273d" stroke-width="1.5" stroke-dasharray="4 4"/>
  <!-- Cyber Avatar Graphic -->
  <circle cx="100" cy="78" r="30" fill="#141926" stroke="#00f0ff" stroke-width="2"/>
  <path d="M50 160 C50 120, 150 120, 150 160" fill="#141926" stroke="#a855f7" stroke-width="2"/>
  <!-- Tech Glasses / Visor -->
  <rect x="80" y="70" width="40" height="12" rx="4" fill="#00f0ff" fill-opacity="0.9"/>
  <circle cx="100" cy="100" r="6" fill="#00f0ff" opacity="0.8"/>
</svg>
